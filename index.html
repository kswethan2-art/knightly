
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101713">
  <title>Knightly — Play Chess Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101713;
      color: #f4f5f0;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 7%;
      border-bottom: 1px solid #29352d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 27px; font-weight: bold; color: #b6e3a3; }
    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 25px;
      text-align: center;
    }
    h1 { font-size: clamp(38px, 8vw, 65px); margin-bottom: 12px; }
    h1 span { color: #b6e3a3; }
    p { color: #a5b2a8; line-height: 1.7; }
    .panel {
      background: #1a241e;
      border: 1px solid #344238;
      border-radius: 18px;
      padding: 28px;
      max-width: 440px;
      margin: 35px auto;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: 1px solid #465448;
      border-radius: 9px;
      background: #101713;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #b6e3a3;
      color: #142018;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary {
      background: #303e34;
      color: white;
    }
    #status { margin-top: 20px; color: #b6e3a3; }
    footer { color: #758278; padding: 30px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="logo">♞ KNIGHTLY</div>
    <div>ONLINE CHESS</div>
  </header>

  <main>
    <h1>Play chess.<br><span>Think deeper.</span></h1>
    <p>Challenge your friends, improve your game and enjoy chess together.</p>

    <div class="panel">
      <h2>Play Online</h2>
      <input id="player" placeholder="Enter your name">
      <button onclick="createGame()">Create a game</button>
      <input id="room" placeholder="Enter room code">
      <button class="secondary" onclick="joinGame()">Join a game</button>
      <div id="status">Welcome to Knightly!</div>
    </div>
  </main>

  <footer>© 2026 Knightly Chess. Play sharp. Think deeper.</footer>

  <script>
    function createGame() {
      document.getElementById("status").textContent =
        "Multiplayer server deployment is coming next!";
    }
    function joinGame() {
      document.getElementById("status").textContent =
        "Multiplayer server deployment is coming next!";
    }
  </script>
</body>
</html>
